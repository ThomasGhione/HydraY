[package]
name = "hydray-trainer"
version = "0.1.0"
edition = "2021"

# bullet is GPU-only (cuda/rocm/metal): the `trainer` binary is meant to run on
# Colab (T4, --features cuda). The `sanity` binary is pure std and always
# buildable locally - it is the reference reader for quantised.bin and the
# specification for the engine-side C++ loader (NNUE Fase 3).

[dependencies]
# b24b38d (#546): the first rev whose faux_quantise has a backward pass (straight-through);
# at cebc78a it lowered to Round, whose gradient is unimplemented, so QAT could not train.
bullet_lib = { git = "https://github.com/jw1912/bullet", rev = "b24b38d53905273bf78548990da816d11510ca9f", optional = true }
# Same rev as bullet_lib, for TValue (custom initial weights), which bullet_lib does not re-export.
bullet_compiler = { package = "bullet-compiler", git = "https://github.com/jw1912/bullet", rev = "b24b38d53905273bf78548990da816d11510ca9f", optional = true }

[features]
train = ["dep:bullet_lib", "dep:bullet_compiler"]
cuda = ["train", "bullet_lib/cuda"]

[[bin]]
name = "trainer"
path = "src/bin/trainer.rs"
required-features = ["train"]

[[bin]]
name = "trainer_deep"
path = "src/bin/trainer_deep.rs"
required-features = ["train"]

[[bin]]
name = "sanity"
path = "src/bin/sanity.rs"

[[bin]]
name = "sanity_deep"
path = "src/bin/sanity_deep.rs"

[[bin]]
name = "datastats"
path = "src/bin/datastats.rs"

[[bin]]
name = "datashuffle"
path = "src/bin/datashuffle.rs"

[[bin]]
name = "datamix"
path = "src/bin/datamix.rs"
